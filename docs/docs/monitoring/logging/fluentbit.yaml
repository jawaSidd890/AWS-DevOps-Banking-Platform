apiVersion: v1
kind: ConfigMap
metadata:
  name: fluent-bit-config
data:
  fluent-bit.conf: |
    [SERVICE]
        Flush        5
        Log_Level    info

    [INPUT]
        Name         tail
        Path         /var/log/containers/*.log

    [OUTPUT]
        Name cloudwatch_logs
        region ap-south-1
        log_group_name banking-logs
